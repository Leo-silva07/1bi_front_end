<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="cadastro.css">
</head>

<body>
    <h1>Página de Cadastro</h1>
    <fieldset>
        <legend>Crie uma Conta</legend>
        <form action="futebol.html" method="get">
            <label for="nome">Nome:</label>
            <br>
            <input type="text" id="nome" name="nome" title="Informe seu nome" pattern="[A-Za-zÀ-ÿ]+( [A-Za-zÀ-ÿ]+)*"
                placeholder="Informe seu nome" required maxlength="50">
            <br>
            <br>

            <label for="email">E-mail:</label>
            <br>
            <input type="email" id="email" name="email" title="Informe seu e-mail" placeholder="seuemail@dominio.com"
                required>
            <br>
            <br>

            <label for="senha">Senha (mínimo 8 caracteres)</label>
            <br>
            <input type="password" id="senha" name="senha" title="Informe seus senha" placeholder="Informe sua senha"
                required minlength="8">
            <br>
            <br>

            <label for="genero">Gênero:</label>
            <br>
            <input type="radio" id="feminino" name="genero" value="feminino" required>
            <label for="feminino">Feminino</label>
            <br>
            <input type="radio" id="masculino" name="genero" value="masculino" required>
            <label for="masculino">Masculino</label>
            <br>
            <input type="radio" id="outro" name="genero" value="outro">
            <label for="outro">Outro</label>
            <br>
            <br>

            <label for="bio">Biografia:</label>
            <br>
            <textarea name="bio" id="bio" rows="6" cols="25" placeholder="Fale um pouco sobre você..."
                required></textarea>
            <br>
            <br>

            <input type="checkbox" id="termos" name="termos" value="aceito" required>
            <label for="termos">Eu li e aceito os termos de serviço</label>
            <br>
            <br>

            <input type="submit" value="Cadastrar">
            <input type="reset" value="limpar">

        </form>
    </fieldset>
</body>

</html>
