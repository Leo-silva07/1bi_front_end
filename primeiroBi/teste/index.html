<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <style>
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
        }

        .modal:target {
            display: flex;
        }

        .modal-conteudo {
            background: white;
            padding: 20px 30px;
            border-radius: 8px;
            max-width: 400px;
            position: relative;
        }

        .fechar {
            position: absolute;
            top: 10px;
            right: 15px;
            text-decoration: none;
            color: black;
            font-size: 20px;
        }
    </style>
</head>

<body>
    <h1>Página de Cadastro</h1>
    <fieldset>
        <legend>Crie uma Conta</legend>
        <form action="/url-api-back-end" method="post">

            <label for="nome">Nome:</label>
            <br>
            <input type="text" id="nome" name="nome" title="Informe seu nome" pattern="[A-Za-z]+"
                placeholder="Informe seu nome" required maxlength="50">
            <br>
            <br>

            <label for="email">E-mail:</label>
            <br>
            <input type="email" id="email" name="email" title="Informe seu e-mail" placeholder="seuemail@dominio.com"
                required>
            <br>
            <br>

            <label for="senha">Senha (mínimo 8 caracteres)</label>
            <br>
            <input type="password" id="senha" name="senha" title="Informe sua senha" placeholder="Informe sua senha"
                required minlength="8">
            <br>
            <br>

            <label for="genero">Gênero:</label>
            <br>
            <input type="radio" id="feminino" name="genero" value="feminino" required>
            <label for="feminino">Feminino</label>
            <br>
            <input type="radio" id="masculino" name="genero" value="masculino" required>
            <label for="masculino">Masculino</label>
            <br>
            <input type="radio" id="outro" name="genero" value="outro" required>
            <label for="outro">Outro</label>
            <br>
            <br>

            <label for="bio">Biografia:</label>
            <br>
            <textarea name="bio" id="bio" rows="6" cols="25" placeholder="Fale um pouco sobre você..." required></textarea>
            <br>
            <br>

            <input type="checkbox" id="termos" name="termos" value="aceito" required>
            <label for="termos">Eu li e aceito os <a href="#termos-modal">termos de serviço</a>.</label>
            <br>
            <br>

            <input type="submit" value="Cadastrar">
            <input type="reset" value="Limpar">

        </form>
    </fieldset>

    <div id="termos-modal" class="modal">
        <div class="modal-conteudo">
            <a href="#" class="fechar">&times;</a>
            <h2>Termos de Serviço</h2>
            <p>Aqui vai o texto dos seus termos de serviço...</p>
        </div>
    </div>

</body>

</html>
